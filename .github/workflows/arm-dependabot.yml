name: arm-dependabot

# Thin caller of the shared kattakath/.github arm-dependabot workflow: arms auto-merge on open
# Dependabot PRs from a schedule. A Dependabot-triggered run gets only Dependabot secrets, so
# the CI App key is unreachable there; a scheduled run keeps Actions secrets.
#
# This repo is user-owned, so the kattakath org's CI_BOT_CLIENT_ID / CI_BOT_APP_PRIVATE_KEY
# never reach it: both are set on the repo, as in ismailkattakath/userscripts. Until they are,
# the job is skipped rather than red every six hours.
on:
  schedule:
    - cron: "41 */6 * * *" # off the hour: GitHub delays and drops runs at peak
  workflow_dispatch:
concurrency:
  group: arm-dependabot
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
jobs:
  arm:
    if: ${{ vars.CI_BOT_CLIENT_ID != '' }}
    uses: kattakath/.github/.github/workflows/arm-dependabot.yml@a605631adbddd3bc935eda81ff2107f3616b40c6 # v1.0.2
    with:
      client-id: ${{ vars.CI_BOT_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
