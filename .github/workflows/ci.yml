name: ci

on:
  # The owner's changes land by direct push (admin bypass), so CI runs on push to main too.
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    if: ${{ !cancelled() }}
    needs: [gitleaks, flake-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: kattakath/.github/actions/gate@90aa18fe95a8bf0e84dc373f78f1fc03eb21c0ea # v1.0.1
        with:
          needs: ${{ toJSON(needs) }}
          expect: '{"gitleaks": true, "flake-check": true}'

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over all history
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1
          git --no-banner --redact .

  # Every flake check on both Linux arches, through the ONE shared reusable workflow
  # (kattakath/.github nix-flake-check.yml): the devShell's toolchain, treefmt and each
  # generated file's drift check (files:<path>).
  flake-check:
    uses: kattakath/.github/.github/workflows/nix-flake-check.yml@90aa18fe95a8bf0e84dc373f78f1fc03eb21c0ea # v1.0.1
