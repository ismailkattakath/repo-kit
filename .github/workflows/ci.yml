name: ci

on:
  # The owner's changes land by direct push (admin bypass), so CI runs on push to main too.
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    if: ${{ !cancelled() }}
    needs: [gitleaks, flake-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: kattakath/.github/actions/gate@1d485b208f64f14ffd52923e877c8a9c2521c4bb
        with:
          needs: ${{ toJSON(needs) }}
          expect: '{"gitleaks": true, "flake-check": true}'

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over all history
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1
          git --no-banner --redact .

  # Every check on both Linux arches the kit targets: the devShell's toolchain, treefmt,
  # and each generated file's drift check (files:<path>).
  flake-check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix flake check
        run: nix flake check --print-build-logs
