# Generated by repo-kit (nix run .#write-files); change repoKit.dependabot, not this file.
# github-actions: weekly, one grouped PR, a 7-day cooldown (a supply-chain hold), on /
# plus each composite action with its own uses: (repoKit.dependabot.githubActions).
---
updates:
- cooldown:
    default-days: 7
  directories:
  - /
  groups:
    github-actions:
      patterns:
      - '*'
  package-ecosystem: github-actions
  schedule:
    interval: weekly
version: 2
