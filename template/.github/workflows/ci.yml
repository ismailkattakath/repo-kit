name: ci

# The fleet's shared check (kattakath/.github's nix-flake-check reusable) behind the
# required `gate` job. `gate` stays a TOP-LEVEL job: rulesets require that exact check name.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flake-check:
    uses: kattakath/.github/.github/workflows/nix-flake-check.yml@cad98392a903fd89ec732ea116f38ec871e38ac0 # main

  gate:
    if: ${{ !cancelled() }}
    needs: [flake-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: kattakath/.github/actions/gate@cad98392a903fd89ec732ea116f38ec871e38ac0 # main
        with:
          needs: ${{ toJSON(needs) }}
          expect: '{"flake-check": true}'
